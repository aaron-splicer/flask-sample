name: Validate
on:
  push:
    paths-ignore:
      - '.*/**'
      - '**/.*'
      - 'Dockerfile*'
      - '*.md'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check Flask app
        run: python -m py_compile app.py
      - name: Validate CSS
        run: |
          if command -v csslint &> /dev/null; then
            csslint static/style.css || true
          else
            echo "csslint not available, skipping CSS validation"
          fi
      - name: Validate HTML templates
        run: |
          python -c "
          import html.parser
          with open('templates/index.html', 'r') as f:
              parser = html.parser.HTMLParser()
              parser.feed(f.read())
          print('HTML syntax valid')
          "