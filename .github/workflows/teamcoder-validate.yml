name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check Flask app
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate CSS syntax
        run: |
          if command -v csslint &> /dev/null; then
            csslint static/style.css || true
          else
            echo "csslint not available, skipping CSS validation"
          fi
        timeout-minutes: 5

      - name: Validate HTML syntax
        run: |
          pip install html5lib > /dev/null 2>&1
          python -c "from html.parser import HTMLParser; HTMLParser().feed(open('templates/index.html').read())"
        timeout-minutes: 5