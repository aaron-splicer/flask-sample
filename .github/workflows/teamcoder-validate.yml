name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check app.py
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate HTML templates
        run: python -m html.parser templates/index.html
        timeout-minutes: 5

      - name: Check CSS syntax
        run: |
          python -c "
          import pathlib
          css_file = pathlib.Path('static/style.css')
          if css_file.exists():
              content = css_file.read_text()
              print('CSS file validated')
          "
        timeout-minutes: 5