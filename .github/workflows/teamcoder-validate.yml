name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check app.py
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate HTML templates
        run: |
          for file in templates/*.html; do
            if [ -f "$file" ]; then
              python -m html.parser "$file" > /dev/null && echo "✓ $file"
            fi
          done
        timeout-minutes: 5

      - name: Validate CSS syntax
        run: |
          python -c "
          import re
          with open('static/style.css', 'r') as f:
              content = f.read()
              if re.search(r'\{[^}]*\}', content):
                  print('✓ CSS structure appears valid')
              else:
                  print('⚠ No CSS rules found')
          "
        timeout-minutes: 5