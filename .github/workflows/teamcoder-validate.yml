name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - '**/Dockerfile*'
      - '**/*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check Flask application
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate HTML templates
        run: |
          python -m py_compile templates/*.html 2>/dev/null || true
        timeout-minutes: 5

      - name: Check CSS syntax
        run: |
          if command -v csslint &> /dev/null; then
            csslint static/style.css || true
          fi
        timeout-minutes: 5

      - name: Import Flask app module
        run: python -c "import app; print('Flask app imports successfully')"
        timeout-minutes: 5