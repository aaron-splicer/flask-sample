name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - '**/Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check Python code
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate Flask app structure
        run: python -c "import app; assert hasattr(app, 'app'), 'Flask app object not found'"
        timeout-minutes: 5

      - name: Check static files
        run: |
          test -f static/style.css && echo "✓ style.css found"
          test -f templates/index.html && echo "✓ index.html found"
        timeout-minutes: 5