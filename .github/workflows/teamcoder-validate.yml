name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check app.py
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate Jinja2 templates
        run: |
          python -c "
          from jinja2 import Environment, FileSystemLoader, TemplateSyntaxError
          env = Environment(loader=FileSystemLoader('templates'))
          for template_name in ['index.html']:
            try:
              env.get_template(template_name)
              print(f'✓ {template_name}')
            except TemplateSyntaxError as e:
              print(f'✗ {template_name}: {e}')
              exit(1)
          "
        timeout-minutes: 5

      - name: Check CSS syntax
        run: |
          python -m pip install tinycss2 --quiet
          python -c "
          import tinycss2
          with open('static/style.css') as f:
            rules = tinycss2.parse_stylesheet(f.read())
          print('✓ style.css parses without errors')
          "
        timeout-minutes: 5