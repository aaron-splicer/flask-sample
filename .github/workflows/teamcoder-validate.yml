name: Validate
on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Check Python syntax
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate Flask app structure
        run: timeout 5s python -c "from app import app; print('Flask app loaded successfully')" || true
        timeout-minutes: 5