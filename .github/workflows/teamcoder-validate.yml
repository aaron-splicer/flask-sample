name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check app.py
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate HTML templates
        run: python -m py_compile templates/*.html 2>/dev/null || echo "HTML validation skipped (not Python)"
        timeout-minutes: 5

      - name: Check CSS syntax
        run: |
          if command -v stylelint &> /dev/null; then
            stylelint static/style.css || true
          else
            echo "stylelint not available, skipping CSS check"
          fi
        timeout-minutes: 5