name: Validate
on:
  push:
    paths-ignore:
      - '.*/**'
      - '**/Dockerfile*'
      - '**/*.md'
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5
      - name: Validate Python syntax
        run: python -m py_compile app.py
        timeout-minutes: 5
      - name: Check Flask app structure
        run: python -c "import sys; sys.path.insert(0, '.'); from app import app; print('Flask app loaded successfully')"
        timeout-minutes: 5