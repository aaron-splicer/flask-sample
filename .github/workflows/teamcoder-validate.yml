name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check Flask app
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate HTML templates
        run: |
          python -c "
          import ast
          import os
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('templates'))
          for fname in os.listdir('templates'):
            if fname.endswith('.html'):
              env.get_template(fname)
          print('Templates valid')
          "
        timeout-minutes: 5

      - name: Validate CSS syntax
        run: |
          python -c "
          import re
          with open('static/style.css', 'r') as f:
            content = f.read()
            if '{' in content and '}' in content:
              print('CSS structure valid')
          "
        timeout-minutes: 5