name: Validate
on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5
      - name: Syntax check Flask app
        run: python -m py_compile app.py
        timeout-minutes: 5
      - name: Validate HTML templates
        run: python -c "import html.parser; [html.parser.HTMLParser().feed(open(f).read()) for f in __import__('glob').glob('templates/*.html')]"
        timeout-minutes: 5