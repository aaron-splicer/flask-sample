name: Validate

on:
  push:
    paths-ignore:
      - '.*'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Syntax check app.py
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Lint with Python
        run: python -m py_compile app.py requirements.txt || true
        timeout-minutes: 5