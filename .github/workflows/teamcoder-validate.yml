name: Validate

on:
  push:
    paths-ignore:
      - '.*'
      - 'Dockerfile*'
      - '*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5

      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5

      - name: Compile Python syntax check
        run: python -m py_compile app.py
        timeout-minutes: 5

      - name: Validate Flask app structure
        run: |
          python -c "
          import ast
          with open('app.py', 'r') as f:
            ast.parse(f.read())
          print('app.py syntax valid')
          "
        timeout-minutes: 5

      - name: Verify static assets
        run: |
          test -f static/style.css && echo "✓ style.css found"
          test -f templates/index.html && echo "✓ index.html found"
        timeout-minutes: 5