name: Validate
on:
  push:
    paths-ignore:
      - '.*/**'
      - 'Dockerfile*'
      - '*.md'
jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5
      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5
      - name: Syntax check Python files
        run: python -m py_compile app.py
        timeout-minutes: 5
      - name: Validate HTML templates
        run: python -m html.parser templates/index.html
        timeout-minutes: 5
      - name: Validate CSS syntax
        run: |
          if command -v csslint &> /dev/null; then
            csslint static/style.css || true
          fi
        timeout-minutes: 5
      - name: Check Flask app imports
        run: python -c "import app; print('Flask app imports successfully')"
        timeout-minutes: 5