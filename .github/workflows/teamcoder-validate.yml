name: Validate

on:
  push:
    paths-ignore:
      - '.*/**'
      - '**/Dockerfile*'
      - '**/*.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        timeout-minutes: 5
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        timeout-minutes: 5
      
      - name: Validate Python syntax
        run: python -m py_compile app.py
        timeout-minutes: 5
      
      - name: Validate Flask configuration
        run: |
          python -c "import app; app.app.config['TESTING'] = True; print('Flask app loads successfully')"
        timeout-minutes: 5